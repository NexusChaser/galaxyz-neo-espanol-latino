name: 📝 Error de traducción
description: Reporta un texto mal traducido, cortado, raro o que sigue en inglés.
title: "[Traducción] "
labels: ["traducción"]
body:
  - type: markdown
    attributes:
      value: |
        ¡Gracias por ayudar a mejorar el parche! Mientras más detalle, más fácil es encontrarlo y corregirlo.
  - type: dropdown
    id: tipo
    attributes:
      label: Tipo de problema
      options:
        - Traducción incorrecta o que no tiene sentido
        - Texto que sigue en inglés
        - Texto cortado o que se sale del recuadro
        - Error de ortografía o gramática
        - Nombre de personaje/objeto inconsistente
        - Otro
    validations:
      required: true
  - type: input
    id: donde
    attributes:
      label: ¿Dónde aparece?
      description: Pantalla, menú, capítulo/misión, personaje que habla, objeto…
      placeholder: "Ej.: Parte 1 Capítulo 3, diálogo de Rui antes de la batalla"
    validations:
      required: true
  - type: textarea
    id: texto
    attributes:
      label: Texto actual
      description: Copia el texto tal como sale en el juego.
    validations:
      required: true
  - type: textarea
    id: sugerencia
    attributes:
      label: Corrección sugerida (opcional)
  - type: textarea
    id: captura
    attributes:
      label: Captura de pantalla (opcional, pero ayuda mucho)
      description: Arrastra la imagen aquí.
